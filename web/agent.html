<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>forecast-log · agent evaluation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e6e0d4; --sheet: #f7f3ea; --ink: #1c1915; --muted: #5e584e;
      --rule: #c9c0b0; --blue: #1d4e79; --red: #9b2c1f; --green: #2f6b3a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Newsreader", Palatino, serif; }
    main { padding: 16px 20px 20px; max-width: 1400px; margin: 0 auto; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { margin: 0; font-weight: 480; font-size: 28px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }
    .board { margin-top: 14px; display: flex; gap: 12px; align-items: flex-start; }
    .pane { flex: 1; min-width: 0; background: var(--sheet); border: 1px solid var(--rule); }
    aside { width: 430px; flex: none; background: var(--sheet); border: 1px solid var(--rule); padding: 10px 12px; overflow: auto; }
    .pane-head, aside h2 {
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
      padding: 7px 12px; border-bottom: 1px solid var(--rule); margin: 0; font-weight: 500; color: var(--muted);
    }
    aside h2 { padding: 0 0 5px; border-bottom: none; }
    table { border-collapse: collapse; width: 100%; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
    .pane table { font-size: 13px; }
    th { font-weight: 500; font-size: 10.5px; color: var(--muted); text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
    td { padding: 5px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid rgba(201,192,176,.45); }
    th:first-child, td:first-child { text-align: left; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #efe8db; }
    tbody tr.on { background: #e4dccb; }
    .best { color: var(--green); font-weight: 500; }
    .note { color: var(--muted); font-size: 11.5px; line-height: 1.6; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .block + .block { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
    .fam td, .fam th { font-size: 11.5px; padding: 3px 6px; }
    .bar { display: inline-block; height: 7px; background: var(--blue); vertical-align: middle; }
    .bar.over { background: var(--red); }
    .empty { padding: 16px 12px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
    @media (max-width: 1000px) { .board { flex-direction: column; } aside { width: auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Agent evaluation</h1>
      <span class="sub" id="config">loading artifacts/agent_eval_summary.json…</span>
      <span class="sub" id="stamp"></span>
    </header>
    <div class="board">
      <div class="pane">
        <div class="pane-head">Identical resolved questions; every forecaster answers all of them</div>
        <table>
          <thead>
            <tr>
              <th>Forecaster</th><th>Brier</th><th>LogLoss</th><th>ECE</th>
              <th>Directional hit</th><th>n</th><th>$/forecast</th><th>p50 (s)</th><th>Tool calls</th><th>Gate hits</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="foot"></div>
      </div>
      <aside>
        <div class="block">
          <h2 id="picked">Pick a row on the left</h2>
          <table id="rel" class="fam"></table>
        </div>
        <div class="block">
          <h2>By question family · Brier, lower is better</h2>
          <table id="fams" class="fam"></table>
        </div>
        <div class="block note" id="notes"></div>
      </aside>
    </div>
  </main>
  <script>
    const FAMILY = {
      level: "spot level", quantile: "60th percentile",
      band_up: "+5%", band_down: "−5%",
    };
    let report = null, picked = null;

    // Short column labels for the family table; the long names wrap the aside.
    const SHORT = (name) => {
      if (name.includes("blind")) return "agent blind";
      if (name.startsWith("agent")) return "agent";
      if (name.startsWith("analogue")) return "analogue";
      if (name.startsWith("base rate")) return "base rate";
      if (name.startsWith("constant")) return "constant (0.5)";
      return name.replace(/^agent /, "").replace("@api.deepseek.com", "");
    };
    const fmt = (value, digits = 4) => (value === undefined || value === null ? "—" : Number(value).toFixed(digits));
    const pct = (value) => (value === undefined || value === null ? "—" : (value * 100).toFixed(0) + "%");

    function drawRows() {
      const body = document.querySelector("#rows");
      const names = Object.keys(report.predictors);
      const best = Math.min(...names.map((name) => report.predictors[name].brier));
      body.innerHTML = "";
      names
        .slice()
        .sort((a, b) => report.predictors[a].brier - report.predictors[b].brier)
        .forEach((name) => {
          const row = report.predictors[name];
          const tr = document.createElement("tr");
          if (name === picked) tr.className = "on";
          tr.innerHTML =
            `<td>${name}</td>` +
            `<td class="${row.brier === best ? "best" : ""}">${fmt(row.brier)}</td>` +
            `<td>${fmt(row.log_loss)}</td>` +
            `<td>${fmt(row.ece, 3)}</td>` +
            `<td>${pct(row.hit_direction)}</td>` +
            `<td>${row.n ?? report.n}</td>` +
            `<td>${fmt(row.cost_usd_per_forecast, 5)}</td>` +
            `<td>${fmt(row.latency_p50_s, 2)}</td>` +
            `<td>${fmt(row.tool_calls_mean, 2)}</td>` +
            `<td>${row.gate_hits || 0}</td>`;
          tr.onclick = () => { picked = name; drawRows(); drawReliability(); };
          body.appendChild(tr);
        });
      const reference = report.references || {};
      const when = report.generated_at ? new Date(report.generated_at).toLocaleString("zh-CN") : "";
      document.querySelector("#stamp").textContent = when;
      const shared = report.scored_on_shared;
      document.querySelector("#foot").textContent =
        `${report.n} questions${shared && shared !== report.n ? " (all rows scored on the same " + shared + ")" : ""}; ` +
        `realised resolution rate ${pct(reference.observed_rate)}; ` +
        `constant-0.5 Brier ${fmt((reference["constant_0.5"] || {}).brier)}`;
    }

    function drawReliability() {
      if (!picked) return;
      const row = report.predictors[picked];
      document.querySelector("#picked").textContent = `Reliability: ${picked}`;
      const table = document.querySelector("#rel");
      let html = "<thead><tr><th>Probability bin</th><th>n</th><th>Mean forecast</th><th>Realised</th><th>Bias</th></tr></thead><tbody>";
      (row.reliability || []).forEach((bin) => {
        const gap = Math.abs(bin.mean_predicted - bin.observed);
        const width = Math.max(1, Math.round(gap * 260));
        const cls = bin.mean_predicted > bin.observed ? "over" : "";
        html +=
          `<tr><td>${bin.bin}</td><td>${bin.n}</td>` +
          `<td>${pct(bin.mean_predicted)}</td><td>${pct(bin.observed)}</td>` +
          `<td><span class="bar ${cls}" style="width:${width}px"></span> ${gap.toFixed(3)}</td></tr>`;
      });
      table.innerHTML = html + "</tbody>";
    }

    function drawFamilies() {
      const families = Array.from(
        new Set(Object.values(report.predictors).flatMap((row) => Object.keys(row.by_family || {})))
      ).sort();
      if (!families.length) return;
      // Transposed on purpose: two or three question families, six predictors. As rows
      // the predictor names do not fit in the aside; as columns the families do.
      const names = Object.keys(report.predictors).sort(
        (a, b) => report.predictors[a].brier - report.predictors[b].brier
      );
      let html = "<thead><tr><th>Forecaster</th>" +
        families.map((family) => `<th>${FAMILY[family] || family}</th>`).join("") +
        "</tr></thead><tbody>";
      names.forEach((name) => {
        html += `<tr><td>${SHORT(name)}</td>`;
        families.forEach((family) => {
          const entry = (report.predictors[name].by_family || {})[family];
          html += `<td>${entry ? fmt(entry.brier) : "—"}</td>`;
        });
        html += "</tr>";
      });
      document.querySelector("#fams").innerHTML = html + "</tbody>";
    }

    function drawNotes() {
      const rows = Object.entries(report.predictors);
      const failures = rows.filter(([, row]) => row.failures).map(([name, row]) => `${name}: ${row.failures} failures`);
      const gates = rows.filter(([, row]) => row.gate_hits).map(([name, row]) => `${name}: ${row.gate_hits} gate hits`);
      document.querySelector("#notes").innerHTML = [
        "Constant 0.5 is the no-information control. Base rate is the unconditional hit rate of the same threshold.",
        "Analogue model is the repo's state-analogue estimator; agent is an LLM with tool access.",
        "Blind is the same model on the same questions with all tools removed: the ablation for tool value.",
        failures.join("; "), gates.join("; "),
        "Questions are generated from price history, so every outcome is already known: no waiting, no selection.",
        "Runs priced as $0.00 are models missing from the price table, not free inference; token counts are still recorded.",
        "Several models were run on the same bench and re-scored on the questions every row answered, so the columns are comparable.",
        "A model that fails to submit is counted as a failure, not dropped: the failure rate is part of the comparison.",
      ].filter(Boolean).map((line) => `<div>${line}</div>`).join("");
    }

    fetch("/artifacts/agent_eval_summary.json?t=" + Date.now())
      .then((response) => response.json())
      .then((data) => {
        report = data;
        const names = Object.keys(report.predictors);
        picked = names.sort((a, b) => report.predictors[a].brier - report.predictors[b].brier)[0];
        const config = report.config || {};
        const models = config.models_merged;
        const modelLabel = models && models.length > 1
          ? `${models.length} models: ${models.join(", ")}`
          : (config.model || "no model");
        document.querySelector("#config").textContent =
          `${config.symbol} · ${report.n} questions · ${modelLabel} · ${config.modes.join("/")}`;
        drawRows();
        drawReliability();
        drawFamilies();
        drawNotes();
      })
      .catch(() => {
        document.querySelector("#config").textContent = "agent_eval_summary.json not available: run forecast-log agent-eval";
      });
  </script>
</body>
</html>
