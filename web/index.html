<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Nasdaq fear index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
  <script src="/web/vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --paper: #e6e0d4;
      --sheet: #f7f3ea;
      --ink: #1c1915;
      --muted: #5e584e;
      --rule: #c9c0b0;
      --blue: #1d4e79;
      --ochre: #8a5a12;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Newsreader", Palatino, serif;
      overflow: hidden;
    }
    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 22px 14px;
    }
    header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    h1 { margin: 0; font-weight: 480; font-size: 32px; letter-spacing: -0.03em; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    #ranges { margin-left: auto; }
    #horizons button { font-size: 11px; padding: 5px 7px; }
    button {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      padding: 6px 10px;
      cursor: pointer;
    }
    button.active, button:hover { background: var(--ink); color: var(--sheet); }
    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      align-items: baseline;
      margin-top: 14px;
      padding: 8px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
    }
    .readout b { font-weight: 500; font-size: 18px; }
    .readout i { display: inline-block; width: 22px; height: 0; margin-right: 8px; vertical-align: middle; }
    .readout .actual { border-top: 2px solid var(--blue); }
    .readout .forecast { border-top: 2px dashed var(--ochre); }
    .readout .point { border-top: 2px dotted var(--ochre); }
    .readout .naive { border-top: 2px dotted #6b6459; }
    #range-label { margin-left: auto; color: var(--muted); }
    #chart {
      flex: 1;
      min-height: 0;
    }
    .board {
      flex: 1;
      min-height: 0;
      margin-top: 10px;
      display: flex;
      gap: 12px;
    }
    .chart-wrap {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: var(--sheet);
      border: 1px solid var(--rule);
    }
    .chart-wrap #chart { height: 100%; }
    #ladder {
      width: 430px;
      flex: none;
      background: var(--sheet);
      border: 1px solid var(--rule);
      padding: 8px 10px 7px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      overflow: auto;
    }
    #ladder { position: relative; }
    #lad-close {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 10.5px;
      padding: 2px 6px;
    }
    #lad-open { display: none; }
    body.panel-hidden #ladder { display: none; }
    body.panel-hidden #lad-open { display: inline-block; }
    #ladder .lad-cols { display: flex; flex-direction: column; gap: 10px; }
    #ladder .lad-block + .lad-block { border-top: 1px solid var(--rule); padding-top: 8px; }
    #ladder .lad-title { color: var(--muted); margin-bottom: 4px; }
    #ladder .lad-title b { color: var(--ink); font-weight: 500; }
    #ladder table { border-collapse: collapse; }
    #ladder th {
      font-weight: 500;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      padding: 0 7px 2px;
      white-space: nowrap;
    }
    #ladder th:first-child, #ladder td:first-child { text-align: left; }
    #ladder td { padding: 0 7px; text-align: right; white-space: nowrap; }
    #ladder tr.base td { color: var(--muted); }
    #ladder td.out, #ladder td.bad { color: var(--ochre); }
    #ladder .lad-foot {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-line;
    }
    @media (max-width: 720px) {
      body { overflow: auto; }
      main { height: auto; padding: 16px 12px 24px; }
      .board { flex-direction: column; }
      .chart-wrap { flex: none; }
      .chart-wrap #chart { height: 60vh; }
      #ladder { width: auto; font-size: 10.5px; }
      .group { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="symbol">Fear index</h1>
      <div class="group" id="horizons">
        <button type="button" data-n="0" class="active">当天 vs 实际</button>
        <button type="button" data-n="1">预测1天 vs 实际</button>
        <button type="button" data-n="2">预测2天 vs 实际</button>
        <button type="button" data-n="3">预测3天 vs 实际</button>
        <button type="button" data-n="4">预测4天 vs 实际</button>
        <button type="button" data-n="5">预测5天 vs 实际</button>
        <button type="button" data-n="6">预测6天 vs 实际</button>
        <button type="button" data-n="7">预测7天 vs 实际</button>
      </div>
      <div class="group">
        <button type="button" id="naive-toggle" class="active">「不动」对照</button>
        <button type="button" id="lad-open">对账表</button>
      </div>
      <div class="group" id="ranges">
        <button type="button" data-span="90">3个月</button>
        <button type="button" data-span="365" class="active">1年</button>
        <button type="button" data-span="1825">5年</button>
        <button type="button" data-span="0">全部</button>
      </div>
    </header>
    <div class="readout">
      <span id="leg-date">—</span>
      <span><span id="leg-prev-label">昨收</span> <b id="leg-prev">—</b></span>
      <span><i class="point"></i>预测值</span>
      <span><i class="forecast"></i><span id="leg-band-label">今日预测区间</span> <b id="leg-forecast">—</b></span>
      <span><i class="actual"></i><span id="leg-actual-label">今日实际</span> <b id="leg-actual">—</b></span>
      <span id="leg-naive"><i class="naive"></i>「不动」对照</span>
      <span id="leg-error"></span>
      <span id="tomorrow"></span>
      <span id="leg-skill"></span>
      <span id="build"></span>
      <span id="range-label"></span>
    </div>
    <div class="board">
      <div class="chart-wrap">
        <div id="chart"></div>
      </div>
      <aside id="ladder">
        <button type="button" id="lad-close">收起 ×</button>
        <div class="lad-cols">
          <div class="lad-block">
            <div class="lad-title">
              <b id="lad-kind">预测N天 vs 实际</b><span id="lad-note"> · 最近几次</span>
            </div>
            <table>
              <thead>
                <tr><th>哪天说的</th><th>到期日</th><th>预测值</th><th>预测区间</th><th>实际值</th><th>差多少</th></tr>
              </thead>
              <tbody id="lad-current"></tbody>
            </table>
          </div>
          <div class="lad-block" id="lad-history-block">
            <div class="lad-title">各档位成绩 · 历史上每一次「预测N天 vs 实际」</div>
            <table>
              <thead>
                <tr><th>档位</th><th>次数</th><th>平均差</th><th>差%（平均）</th><th>在区间内</th><th>猜不动</th></tr>
              </thead>
              <tbody id="lad-history"></tbody>
            </table>
          </div>
        </div>
        <div class="lad-foot" id="lad-foot"></div>
      </aside>
    </div>
  </main>
  <script>
    // Bumped whenever the drawing code changes. If this is not what you expect, the page is stale.
    const BUILD = "版本 r20 · 预测值 / 预测区间 分开标";

    const chart = LightweightCharts.createChart(document.querySelector("#chart"), {
      autoSize: true,
      layout: {
        background: { type: "solid", color: "#f7f3ea" },
        textColor: "#5e584e",
        fontFamily: '"IBM Plex Mono", ui-monospace, monospace',
      },
      grid: { vertLines: { color: "#eadfce" }, horzLines: { visible: false } },
      rightPriceScale: { borderColor: "#c9c0b0" },
      timeScale: { borderColor: "#c9c0b0", rightOffset: 6, minBarSpacing: 0.04 },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
      handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true } },
    });
    // 色带靠两层填充叠出来：先铺满到上沿，再用背景色盖掉下沿以下的部分。
    // 遮罩必须画在实际线之前，否则会把跌破下沿的实际值一起盖掉。
    const bandFillSeries = chart.addAreaSeries({
      lineColor: "rgba(0,0,0,0)",
      lineWidth: 1,
      topColor: "rgba(176,137,104,0.30)",
      bottomColor: "rgba(176,137,104,0.30)",
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const bandMaskSeries = chart.addAreaSeries({
      lineColor: "rgba(0,0,0,0)",
      lineWidth: 1,
      topColor: "#f7f3ea",
      bottomColor: "#f7f3ea",
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const bandHighSeries = chart.addLineSeries({
      color: "rgba(138,90,18,0.55)",
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const bandLowSeries = chart.addLineSeries({
      color: "rgba(138,90,18,0.55)",
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const forecastSeries = chart.addLineSeries({
      color: "rgba(138,90,18,0.35)",
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dotted,
      priceLineVisible: false,
      lastValueVisible: false,
    });
    const futureSeries = chart.addLineSeries({
      color: "#8a5a12",
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const lowSeries = chart.addLineSeries({
      color: "#b08968",
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const highSeries = chart.addLineSeries({
      color: "#b08968",
      lineWidth: 1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    // 「不动」对照：把发出日的收盘直接搬到目标日，看它是不是也贴着实际。
    const naiveSeries = chart.addLineSeries({
      color: "rgba(94,88,78,0.75)",
      lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.LargeDashed,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    // 实际值最后建，永远压在色带和遮罩之上。
    const actualSeries = chart.addLineSeries({
      color: "#1d4e79",
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    let span = 365;
    let horizon = 0; // 0 = 当天（前一晚说的），1…7 = 提前 N 个交易日
    let timeline = null;
    let closeByTime = new Map();
    let latestTime = null;

    function shift(iso, days) {
      const date = new Date(iso + "T00:00:00Z");
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function timeText(value) {
      if (typeof value === "string") return value;
      if (typeof value === "number") return new Date(value * 1000).toISOString().slice(0, 10);
      if (value && value.year) {
        return value.year + "-" + String(value.month).padStart(2, "0") + "-" + String(value.day).padStart(2, "0");
      }
      return "";
    }

    function barIndexOnOrAfter(times, iso) {
      let from = 0;
      let lo = 0;
      let hi = times.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (times[mid] < iso) lo = mid + 1;
        else { from = mid; hi = mid - 1; }
      }
      return from;
    }

    function applySpan() {
      const times = timeline[symbolOf()].time;
      const extra = 7;
      if (!span) {
        chart.timeScale().fitContent();
        return;
      }
      const from = barIndexOnOrAfter(times, shift(times[times.length - 1], -span));
      chart.timeScale().setVisibleLogicalRange({ from, to: times.length - 1 + extra + 3 });
    }

    chart.timeScale().subscribeVisibleTimeRangeChange((range) => {
      if (!range) return;
      document.querySelector("#range-label").textContent = timeText(range.from) + " → " + timeText(range.to);
    });

    function priceText(value) {
      if (value == null || Number.isNaN(value)) return "—";
      return Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 页面只画 fear index。
    function symbolOf() {
      return "vxn";
    }

    function horizonName(n) {
      return n === 0 ? "当天 vs 实际" : "预测" + n + "天 vs 实际";
    }

    // 某个档位的历史成绩：当天用 daily 的口径，1…7 天后用 ladder 的分步结果。
    function horizonStats() {
      const symbol = symbolOf();
      if (horizon === 0) {
        const skill = timeline.daily[symbol].skill || {};
        if (skill.n == null) return null;
        return {
          n: skill.n,
          mae: skill.mae,
          pct: skill.mean_abs_pct_error,
          coverage: skill.band_coverage,
          naive: skill.baseline_mae,
          naivePct: null,
          width: skill.mean_width,
          move: skill.mean_abs_move,
        };
      }
      const lad = timeline.ladder && timeline.ladder[symbol];
      const step = lad && lad.summary && lad.summary.steps && lad.summary.steps[horizon - 1];
      if (!step) return null;
      return {
        n: step.n,
        mae: step.mae,
        pct: step.mean_abs_pct,
        coverage: step.coverage,
        naive: step.naive_mae,
        naivePct: step.naive_median_abs_pct,
        width: step.mean_width,
        move: step.mean_abs_move,
      };
    }

    function correlation(a, b) {
      const n = a.length;
      if (n < 3) return null;
      let ma = 0;
      let mb = 0;
      for (let i = 0; i < n; i += 1) { ma += a[i]; mb += b[i]; }
      ma /= n; mb /= n;
      let cov = 0;
      let va = 0;
      let vb = 0;
      for (let i = 0; i < n; i += 1) {
        const da = a[i] - ma;
        const db = b[i] - mb;
        cov += da * db;
        va += da * da;
        vb += db * db;
      }
      return va > 0 && vb > 0 ? cov / Math.sqrt(va * vb) : null;
    }

    // 模型的中位线 vs 「把发出日收盘直接搬过去」，两条线和实际的相关有多像。
    function lineCompare() {
      const symbol = symbolOf();
      const price = timeline[symbol];
      const model = [];
      const flat = [];
      const actual = [];
      if (horizon === 0) {
        const daily = timeline.daily[symbol];
        daily.time.forEach((time, index) => {
          model.push(daily.median[index]);
          flat.push(daily.previous[index]);
          actual.push(daily.actual[index]);
        });
      } else {
        const column = timeline.ladder && timeline.ladder[symbol] &&
          timeline.ladder[symbol].columns[String(horizon)];
        if (!column) return null;
        price.time.forEach((time, index) => {
          if (index - horizon < 0 || column.median[index] == null) return;
          model.push(column.median[index]);
          flat.push(price.close[index - horizon]);
          actual.push(price.close[index]);
        });
      }
      const modelCorr = correlation(model, actual);
      const flatCorr = correlation(flat, actual);
      let modelGap = 0;
      let flatGap = 0;
      for (let i = 0; i < actual.length; i += 1) {
        modelGap += Math.abs(model[i] - actual[i]);
        flatGap += Math.abs(flat[i] - actual[i]);
      }
      if (!actual.length) return null;
      return {
        modelCorr,
        flatCorr,
        modelGap: modelGap / actual.length,
        flatGap: flatGap / actual.length,
      };
    }

    // 卡片左边那张表：这个档位最近几次「说的 vs 实际」，最后一行是还没到期的那次。
    function cardRows() {
      const symbol = symbolOf();
      const price = timeline[symbol];
      const last = price.time.length - 1;
      const rows = [];
      if (horizon === 0) {
        const daily = timeline.daily[symbol];
        const total = daily.time.length;
        for (let i = Math.max(0, total - 6); i < total; i += 1) {
          rows.push({
            asOf: i > 0 ? daily.time[i - 1] : "—",
            target: daily.time[i],
            said: daily.median[i],
            low: daily.low[i],
            high: daily.high[i],
            actual: daily.actual[i],
          });
        }
        const next = daily.tomorrow;
        if (next) {
          rows.push({
            asOf: price.time[last],
            target: next.time,
            said: next.median,
            low: next.low,
            high: next.high,
            actual: null,
          });
        }
        return rows;
      }
      const lad = timeline.ladder && timeline.ladder[symbol];
      const column = lad && lad.columns[String(horizon)];
      if (column) {
        let taken = 0;
        for (let i = last; i >= 0 && taken < 6; i -= 1) {
          if (column.median[i] == null || i - horizon < 0) continue;
          rows.push({
            asOf: price.time[i - horizon],
            target: price.time[i],
            said: column.median[i],
            low: column.low[i],
            high: column.high[i],
            actual: price.close[i],
          });
          taken += 1;
        }
        rows.reverse();
      }
      const fan = (timeline.forward || {})[symbol] || [];
      const pending = fan[horizon - 1];
      if (pending) {
        rows.push({
          asOf: price.time[last],
          target: pending.time,
          said: pending.median,
          low: pending.low,
          high: pending.high,
          actual: null,
        });
      }
      return rows;
    }

    function renderCard() {
      document.querySelector("#lad-kind").textContent = horizonName(horizon);
      const body = document.querySelector("#lad-current");
      body.textContent = "";
      cardRows().forEach((item) => {
        const gap = item.actual != null ? item.said - item.actual : null;
        const inside = item.actual != null ? item.actual >= item.low && item.actual <= item.high : null;
        const tr = document.createElement("tr");
        const cells = [
          [item.asOf.slice(5), ""],
          [item.target.slice(5), ""],
          [priceText(item.said), ""],
          [priceText(item.low) + "–" + priceText(item.high), inside === false ? "out" : ""],
          [priceText(item.actual), ""],
          [
            gap == null
              ? "还没到"
              : (gap >= 0 ? "+" : "−") + Math.abs(gap).toFixed(2) + " (" +
                (gap >= 0 ? "+" : "−") + Math.abs((gap / item.actual) * 100).toFixed(1) + "%)",
            gap == null ? "" : Math.abs(gap / item.actual) > 0.1 ? "bad" : "",
          ],
        ];
        cells.forEach(([value, className]) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (className) td.className = className;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      const stats = horizonStats();
      document.querySelector("#lad-foot").textContent = stats
        ? stats.n + " 次 · 平均差 " + stats.mae.toFixed(2) + " 点 · 差% " +
          (stats.pct * 100).toFixed(1) + "%（照「不动」猜是 " + stats.naive.toFixed(2) + " 点" +
          (stats.naivePct == null ? "" : " / " + (stats.naivePct * 100).toFixed(1) + "%") + "）\n" +
          "色带宽 " + (stats.width * 100).toFixed(1) + "%，这档实际涨跌平均只有 " +
          (stats.move * 100).toFixed(1) + "%——宽了 " + (stats.width / stats.move).toFixed(1) +
          " 倍，所以 " + Math.round(stats.coverage * 100) + "% 落在里面是带宽的功劳，不是点位的。" +
          (function () {
            const pair = lineCompare();
            if (!pair) return "";
            return "\n把发出日的收盘直接搬过去（灰色长虚线）：平均差 " + pair.flatGap.toFixed(2) +
              " 点、和实际相关 " + pair.flatCorr.toFixed(3) + "；模型 " + pair.modelGap.toFixed(2) +
              " 点、相关 " + pair.modelCorr.toFixed(3) + "。趋势是序列自己的，不是模型给的。";
          })()
        : "";
    }

    function renderHistory() {
      const symbol = symbolOf();
      const body = document.querySelector("#lad-history");
      const block = document.querySelector("#lad-history-block");
      body.textContent = "";
      const skill = timeline.daily[symbol].skill || {};
      const lad = timeline.ladder && timeline.ladder[symbol];
      const steps = (lad && lad.summary && lad.summary.steps) || [];
      const rows = [];
      if (skill.n != null) {
        rows.push({
          label: "当天",
          n: skill.n,
          mae: skill.mae,
          pct: skill.mean_abs_pct_error,
          coverage: skill.band_coverage,
          naive: skill.baseline_mae,
        });
      }
      steps.forEach((step) => {
        rows.push({
          label: "预测" + step.step + "天",
          n: step.n,
          mae: step.mae,
          pct: step.mean_abs_pct,
          coverage: step.coverage,
          naive: step.naive_mae,
        });
      });
      block.style.display = rows.length ? "" : "none";
      if (!rows.length) return;
      rows.forEach((item, index) => {
        const tr = document.createElement("tr");
        if (index === horizon) tr.className = "on";
        const cells = [
          item.label,
          String(item.n),
          item.mae.toFixed(2),
          (item.pct * 100).toFixed(1) + "%",
          Math.round(item.coverage * 100) + "%",
          item.naive.toFixed(2),
        ];
        cells.forEach((value) => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    // 图上画什么：当天画每一根的当日区间，1…7 天后画那一天出发、落在目标日上的区间。
    function drawSeries() {
      const symbol = symbolOf();
      const price = timeline[symbol];
      const last = price.time.length - 1;
      const lastTime = price.time[last];
      const lastClose = price.close[last];
      let predicted = [];
      let highLine = [];
      let lowLine = [];
      let ahead = [{ time: lastTime, value: lastClose }];
      let low = [{ time: lastTime, value: lastClose }];
      let high = [{ time: lastTime, value: lastClose }];

      if (horizon === 0) {
        const daily = timeline.daily[symbol];
        const forward = (timeline.forward || {})[symbolOf()] || [];
        predicted = daily.time.map((time, index) => ({ time, value: daily.median[index] }));
        highLine = daily.time.map((time, index) => ({ time, value: daily.high[index] }));
        lowLine = daily.time.map((time, index) => ({ time, value: daily.low[index] }));
        const next = daily.tomorrow;
        if (next) {
          predicted.push({ time: next.time, value: next.median });
          highLine.push({ time: next.time, value: next.high });
          lowLine.push({ time: next.time, value: next.low });
        }
        forward.forEach((point) => {
          ahead.push({ time: point.time, value: point.median });
          low.push({ time: point.time, value: point.low });
          high.push({ time: point.time, value: point.high });
        });
      } else {
        const lad = timeline.ladder && timeline.ladder[symbol];
        const column = lad && lad.columns[String(horizon)];
        if (column) {
          price.time.forEach((time, index) => {
            if (column.median[index] == null) return;
            predicted.push({ time, value: column.median[index] });
            highLine.push({ time, value: column.high[index] });
            lowLine.push({ time, value: column.low[index] });
          });
        }
        const fan = (timeline.forward || {})[symbol] || [];
        const pending = fan[horizon - 1];
        if (pending) {
          predicted.push({ time: pending.time, value: pending.median });
          highLine.push({ time: pending.time, value: pending.high });
          lowLine.push({ time: pending.time, value: pending.low });
          ahead.push({ time: pending.time, value: pending.median });
          low.push({ time: pending.time, value: pending.low });
          high.push({ time: pending.time, value: pending.high });
        }
      }
      const naive = [];
      if (horizon === 0) {
        const daily = timeline.daily[symbol];
        daily.time.forEach((time, index) => {
          naive.push({ time, value: daily.previous[index] });
        });
      } else {
        price.time.forEach((time, index) => {
          if (index - horizon < 0) return;
          if (horizon >= 1) {
            const column = timeline.ladder && timeline.ladder[symbol] &&
              timeline.ladder[symbol].columns[String(horizon)];
            if (!column || column.median[index] == null) return;
          }
          naive.push({ time, value: price.close[index - horizon] });
        });
      }
      naiveSeries.setData(naive);
      bandHighSeries.setData(highLine);
      bandLowSeries.setData(lowLine);
      bandFillSeries.setData(highLine);
      bandMaskSeries.setData(lowLine);
      actualSeries.setData(price.time.map((time, index) => ({ time, value: price.close[index] })));
      forecastSeries.setData(predicted);
      futureSeries.setData(ahead);
      lowSeries.setData(low);
      highSeries.setData(high);
    }

    function updateLegend(time) {
      const point = time || latestTime;
      if (!point) return;
      const symbol = symbolOf();
      const price = timeline[symbol];
      const last = price.time.length - 1;
      const index = price.time.indexOf(point);
      document.querySelector("#leg-date").textContent = point;
      document.querySelector("#leg-actual").textContent = priceText(closeByTime.get(point));
      let said = null;
      let asOf = null;
      let actual = closeByTime.has(point) ? closeByTime.get(point) : null;
      if (horizon === 0) {
        const daily = timeline.daily[symbol];
        const row = daily.time.indexOf(point);
        if (row >= 0) {
          said = { median: daily.median[row], low: daily.low[row], high: daily.high[row] };
          asOf = row > 0 ? daily.time[row - 1] : null;
        }
        document.querySelector("#leg-prev-label").textContent = "昨收";
        document.querySelector("#leg-band-label").textContent = "当天预测区间";
        document.querySelector("#leg-actual-label").textContent = "当天实际";
      } else {
        const lad = timeline.ladder && timeline.ladder[symbol];
        const column = lad && lad.columns[String(horizon)];
        if (column && index >= horizon && column.median[index] != null) {
          said = { median: column.median[index], low: column.low[index], high: column.high[index] };
          asOf = price.time[index - horizon];
        }
        document.querySelector("#leg-prev-label").textContent = "预测" + horizon + "天时的收盘";
        document.querySelector("#leg-band-label").textContent = "预测" + horizon + "天时说的区间";
        document.querySelector("#leg-actual-label").textContent = "实际";
      }
      document.querySelector("#leg-prev").textContent = priceText(asOf ? closeByTime.get(asOf) : null);
      document.querySelector("#leg-forecast").textContent = said
        ? priceText(said.low) + " – " + priceText(said.high)
        : "—";
      if (!said || actual == null || asOf == null) {
        document.querySelector("#leg-error").textContent = "";
      } else {
        const gap = said.median - actual;
        const inside = actual >= said.low && actual <= said.high;
        document.querySelector("#leg-error").textContent =
          (asOf.slice(5) + " 说的，差 ") +
          (gap >= 0 ? "+" : "−") + Math.abs(gap).toFixed(2) +
          "（" + (gap >= 0 ? "+" : "−") + Math.abs((gap / actual) * 100).toFixed(1) + "%）" +
          (inside ? " ✓" : " ✗");
      }
      const stats = horizonStats();
      document.querySelector("#leg-skill").textContent = stats
        ? horizonName(horizon) + "：" + stats.n + " 次，平均差 " + stats.mae.toFixed(2) +
          " 点，差% " + (stats.pct * 100).toFixed(1) + "%，" +
          Math.round(stats.coverage * 100) + "% 在区间内"
        : "";
    }

    chart.subscribeCrosshairMove((param) => updateLegend(param.time || latestTime));

    function showQuestion() {
      const price = timeline[symbolOf()];
      closeByTime = new Map(price.time.map((time, index) => [time, price.close[index]]));
      document.querySelector("#symbol").textContent = "Fear index";
      document.title = "Fear index · " + horizonName(horizon);
      drawSeries();
      renderCard();
      renderHistory();
      document.querySelector("#tomorrow").textContent =
        horizon === 0
          ? "当天的区间：用前一晚的收盘算，画在当天"
          : "预测" + horizon + "天：提前 " + horizon + " 个交易日说的区间，画在到期那一天";
      document.querySelector("#tomorrow").style.color = "#5e584e";
      document.querySelector("#build").textContent = BUILD;
      latestTime = price.time[price.time.length - 1];
      requestAnimationFrame(applySpan);
      updateLegend(latestTime);
    }

    let showNaive = true;
    document.querySelector("#naive-toggle").addEventListener("click", (event) => {
      showNaive = !showNaive;
      event.currentTarget.classList.toggle("active", showNaive);
      naiveSeries.applyOptions({ visible: showNaive });
      document.querySelector("#leg-naive").style.display = showNaive ? "" : "none";
    });

    document.querySelector("#lad-close").addEventListener("click", () => {
      document.body.classList.add("panel-hidden");
      requestAnimationFrame(() => chart.resize && chart.resize());
    });

    document.querySelector("#lad-open").addEventListener("click", () => {
      document.body.classList.remove("panel-hidden");
      requestAnimationFrame(() => chart.resize && chart.resize());
    });

    document.querySelector("#horizons").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      horizon = Number(button.dataset.n);
      document.querySelectorAll("#horizons button").forEach((item) => item.classList.toggle("active", item === button));
      showQuestion();
    });

    document.querySelector("#ranges").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      span = Number(button.dataset.span);
      document.querySelectorAll("#ranges button").forEach((item) => item.classList.toggle("active", item === button));
      applySpan();
    });

    fetch("/artifacts/timeline.json?t=" + Date.now())
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then((documentData) => {
        timeline = documentData;
        showQuestion();
      })
      .catch(() => {
        document.querySelector("#leg-date").textContent = "timeline.json 没有加载";
      });
  </script>
</body>
</html>
