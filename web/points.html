<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Nasdaq-100 · 5 天涨跌点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
  <script src="/web/vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --paper: #e6e0d4; --sheet: #f7f3ea; --ink: #1c1915; --muted: #5e584e;
      --rule: #c9c0b0; --blue: #1d4e79; --red: #9b2c1f; --green: #2f6b3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Newsreader", Palatino, serif; overflow: hidden; }
    main { height: 100%; display: flex; flex-direction: column; padding: 16px 20px 12px; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { margin: 0; font-weight: 480; font-size: 28px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }
    .board { flex: 1; min-height: 0; margin-top: 10px; display: flex; gap: 12px; }
    .panes { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .pane { flex: 1; min-height: 0; background: var(--sheet); border: 1px solid var(--rule); display: flex; flex-direction: column; }
    .pane-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 7px 12px;
      border-bottom: 1px solid var(--rule); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    }
    .pane-head .name { font-size: 15px; font-weight: 500; }
    .pane-head .up { color: var(--green); }
    .pane-head .down { color: var(--red); }
    .chart { flex: 1; min-height: 0; }
    aside {
      width: 340px; flex: none; background: var(--sheet); border: 1px solid var(--rule);
      padding: 10px 12px; font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px; line-height: 1.6; overflow: auto;
    }
    aside h2 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    th { font-weight: 500; font-size: 10.5px; color: var(--muted); text-align: right; padding: 0 5px 3px; }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 0 5px; text-align: right; white-space: nowrap; }
    .block + .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
    .note { color: var(--muted); font-size: 11px; line-height: 1.55; }
    @media (max-width: 900px) {
      body { overflow: auto; } main { height: auto; }
      .board { flex-direction: column; } .pane { min-height: 320px; } aside { width: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nasdaq-100 · 5 天涨跌点</h1>
      <span class="sub" id="question">—</span>
      <span class="sub" id="build"></span>
    </header>
    <div class="board">
      <div class="panes">
        <div class="pane">
          <div class="pane-head">
            <span class="name">全部涨跌预测</span>
            <span class="sub" id="rule">—</span>
            <span class="sub">▲ 说涨（绿=命中，灰=落空）　▼ 说跌（红=命中，灰=落空）</span>
          </div>
          <div class="chart" id="chart"></div>
        </div>
      </div>
      <aside>
        <div class="block">
          <h2>图和点</h2>
          <div class="note">
            纵轴 = 指数收盘。▲ 在下方是「预测 5 天后更高」的点，▼ 在上方是「预测 5 天后更低」的点，
            都画在到期那一天（发出日 + 5 个交易日）。概率落在历史最高 / 最低的 10% 才打点，阈值固定。
            命中的口径是「第 5 个交易日收盘 vs 发出日收盘」，不是 5 天内任意一天。
          </div>
        </div>
        <div class="block">
          <h2>这些点准不准</h2>
          <table id="stats"></table>
        </div>
        <div class="block note" id="note"></div>
      </aside>
    </div>
  </main>
  <script>
    const BUILD = "r5 · 一张图，整体命中率，纵轴取对数";
    document.querySelector("#build").textContent = BUILD;

    function makeChart(id) {
      return LightweightCharts.createChart(document.querySelector(id), {
        autoSize: true,
        layout: { background: { type: "solid", color: "#f7f3ea" }, textColor: "#5e584e",
          fontFamily: '"IBM Plex Mono", ui-monospace, monospace' },
        grid: { vertLines: { color: "#eadfce" }, horzLines: { color: "#eadfce" } },
        // 指数从 200 点长到 3 万点，线性轴会把前二十年压成一条直线，而且留白会掉到负值。
        rightPriceScale: {
          borderColor: "#c9c0b0",
          mode: LightweightCharts.PriceScaleMode.Logarithmic,
          scaleMargins: { top: 0.08, bottom: 0.08 },
        },
        timeScale: { borderColor: "#c9c0b0", rightOffset: 4, minBarSpacing: 0.04 },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true } },
      });
    }
    const chart = makeChart("#chart");
    const line = chart.addLineSeries({
      color: "#1d4e79", lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });

    function percent(value) { return value == null ? "—" : Math.round(value * 100) + "%"; }

    // 一张图：▲ 在下方 = 说涨，▼ 在上方 = 说跌。命中亮色，落空灰色。
    function draw(data) {
      line.setData(data.time.map((time, index) => ({ time, value: data.close[index] })));
      const known = new Set(data.time);
      const markers = [];
      data.flag_up.forEach((flag, index) => {
        if (!flag) return;
        const target = data.target[index];
        if (!target || !known.has(target)) return;
        const hit = data.outcome[index] === 1;
        markers.push({ time: target, position: "belowBar", shape: "arrowUp", size: hit ? 1 : 0.7,
          color: hit ? "#2f6b3a" : "#b3aa9c" });
      });
      data.flag_down.forEach((flag, index) => {
        if (!flag) return;
        const target = data.target[index];
        if (!target || !known.has(target)) return;
        const hit = data.outcome[index] === 0;
        markers.push({ time: target, position: "aboveBar", shape: "arrowDown", size: hit ? 1 : 0.7,
          color: hit ? "#9b2c1f" : "#b3aa9c" });
      });
      markers.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
      line.setMarkers(markers);
      chart.timeScale().fitContent();
    }

    fetch("/artifacts/direction.json?t=" + Date.now())
      .then((response) => { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
      .then((data) => {
        document.querySelector("#question").textContent = data.question.text;
        draw(data);

        const s = data.summary;
        const up = s.up_flags, down = s.down_flags;
        const total = up.n + down.n;
        const hits = Math.round(up.hit * up.n) + Math.round((1 - down.hit) * down.n);
        const all = hits / total;
        // 只按基率猜时，同样这些点该命中多少
        const expect = (s.base_rate * up.n + (1 - s.base_rate) * down.n) / total;
        document.querySelector("#rule").textContent =
          "共 " + total + " 次预测（说涨 " + up.n + " + 说跌 " + down.n + "），整体命中 " +
          (all * 100).toFixed(1) + "%";

        const stats = document.querySelector("#stats");
        stats.textContent = "";
        [
          ["", "说涨的点", "说跌的点", "全部"],
          ["点数", String(up.n), String(down.n), String(total)],
          ["命中", percent(up.hit), percent(1 - down.hit), (all * 100).toFixed(1) + "%"],
          ["只按基率猜", percent(s.base_rate), percent(1 - s.base_rate), (expect * 100).toFixed(1) + "%"],
          ["差值", ((up.hit - s.base_rate) * 100).toFixed(1) + " 点",
            ((1 - down.hit - (1 - s.base_rate)) * 100).toFixed(1) + " 点",
            ((all - expect) * 100).toFixed(1) + " 点"],
          ["模型 Brier", s.brier_model.toFixed(4), s.brier_model.toFixed(4), s.brier_model.toFixed(4)],
          ["只看基率", s.brier_base.toFixed(4), s.brier_base.toFixed(4), s.brier_base.toFixed(4)],
        ].forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });
          stats.appendChild(tr);
        });

        document.querySelector("#note").textContent =
          "整体命中 " + (all * 100).toFixed(1) + "%，误差 ±" + ((100 * Math.sqrt(all * (1 - all) / total))).toFixed(1) +
          " 点。只按基率猜（60% 说涨、40% 说跌）期望 " + (expect * 100).toFixed(1) +
          "%，所以合起来几乎正好是抛硬币。分开看也是这样：说涨的点 " + percent(up.hit) +
          " 对基率 " + percent(s.base_rate) + "，说跌的点 " + percent(1 - down.hit) +
          " 对基率 " + percent(1 - s.base_rate) + "，两边都贴着基率走。";
      })
      .catch(() => { document.querySelector("#question").textContent = "direction.json 没有加载"; });
  </script>
</body>
</html>
