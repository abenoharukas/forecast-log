<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Nasdaq-100 · 5 天后偏涨的点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
  <script src="/web/vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --paper: #e6e0d4; --sheet: #f7f3ea; --ink: #1c1915; --muted: #5e584e;
      --rule: #c9c0b0; --blue: #1d4e79; --red: #9b2c1f; --green: #2f6b3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Newsreader", Palatino, serif; overflow: hidden; }
    main { height: 100%; display: flex; flex-direction: column; padding: 16px 20px 12px; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { margin: 0; font-weight: 480; font-size: 28px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }
    .board { flex: 1; min-height: 0; margin-top: 10px; display: flex; gap: 12px; }
    .pane { flex: 1; min-width: 0; min-height: 0; background: var(--sheet); border: 1px solid var(--rule); display: flex; flex-direction: column; }
    .pane-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 7px 12px;
      border-bottom: 1px solid var(--rule); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    }
    .pane-head .name { font-size: 15px; font-weight: 500; }
    .chart { flex: 1; min-height: 0; }
    aside {
      width: 350px; flex: none; background: var(--sheet); border: 1px solid var(--rule);
      padding: 10px 12px; font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px; line-height: 1.6; overflow: auto;
    }
    aside h2 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    th { font-weight: 500; font-size: 10.5px; color: var(--muted); text-align: right; padding: 0 5px 3px; }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 0 5px; text-align: right; white-space: nowrap; }
    .block + .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
    .note { color: var(--muted); font-size: 11px; line-height: 1.55; }
    ul { margin: 2px 0 0; padding-left: 16px; }
    li { margin: 1px 0; }
    @media (max-width: 900px) {
      body { overflow: auto; } main { height: auto; }
      .board { flex-direction: column; } .pane { min-height: 340px; } aside { width: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nasdaq-100 · 5 天后偏涨的点</h1>
      <span class="sub" id="question">—</span>
      <span class="sub" id="build"></span>
    </header>
    <div class="board">
      <div class="pane">
        <div class="pane-head">
          <span class="name">跨资产偏多 → 5 天后更高</span>
          <span class="sub" id="rule">—</span>
          <span class="sub">绿色 = 命中，灰色 = 落空</span>
        </div>
        <div class="chart" id="chart"></div>
      </div>
      <aside>
        <div class="block">
          <h2>打点规则（事先定死，不看结果）</h2>
          <div class="note">
            四条腿各自做扩张 z 分数再取平均，分数落在当天之前所有历史的 90 分位以上就打点：
            <ul id="legs"></ul>
          </div>
        </div>
        <div class="block">
          <h2>这些点准不准</h2>
          <table id="stats"></table>
        </div>
        <div class="block">
          <h2>今天</h2>
          <div class="note" id="latest"></div>
        </div>
        <div class="block note" id="note"></div>
      </aside>
    </div>
  </main>
  <script>
    document.querySelector("#build").textContent = "r1 · 跨资产风险偏好";

    const chart = LightweightCharts.createChart(document.querySelector("#chart"), {
      autoSize: true,
      layout: { background: { type: "solid", color: "#f7f3ea" }, textColor: "#5e584e",
        fontFamily: '"IBM Plex Mono", ui-monospace, monospace' },
      grid: { vertLines: { color: "#eadfce" }, horzLines: { color: "#eadfce" } },
      rightPriceScale: { borderColor: "#c9c0b0",
        mode: LightweightCharts.PriceScaleMode.Logarithmic,
        scaleMargins: { top: 0.08, bottom: 0.08 } },
      timeScale: { borderColor: "#c9c0b0", rightOffset: 4, minBarSpacing: 0.04 },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
      handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true } },
    });
    const line = chart.addLineSeries({ color: "#1d4e79", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });

    function percent(value) { return value == null ? "—" : Math.round(value * 100) + "%"; }

    function draw(data) {
      line.setData(data.time.map((time, index) => ({ time, value: data.close[index] })));
      const known = new Set(data.time);
      const markers = [];
      data.flag.forEach((flag, index) => {
        if (!flag) return;
        const target = data.target[index];
        if (!target || !known.has(target)) return;
        const hit = data.outcome[index] === 1;
        markers.push({ time: target, position: "belowBar", shape: "arrowUp", size: hit ? 1 : 0.7,
          color: hit ? "#2f6b3a" : "#b3aa9c" });
      });
      markers.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
      line.setMarkers(markers);
      chart.timeScale().fitContent();
    }

    fetch("/artifacts/cross.json?t=" + Date.now())
      .then((response) => { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
      .then((data) => {
        const s = data.summary;
        document.querySelector("#question").textContent = data.question.text;
        document.querySelector("#rule").textContent =
          "共打 " + s.flagged + " 个点，命中 " + percent(s.hit);
        document.querySelector("#legs").textContent = "";
        (data.question.legs || []).forEach((text) => {
          const li = document.createElement("li");
          li.textContent = text;
          document.querySelector("#legs").appendChild(li);
        });
        draw(data);

        const stats = document.querySelector("#stats");
        stats.textContent = "";
        [
          ["", "全部", "2015 年起"],
          ["天数", String(s.n), String(s.holdout_n)],
          ["打点", String(s.flagged), String(s.holdout_flagged)],
          ["命中", percent(s.hit), percent(s.holdout_hit)],
          ["基率（瞎猜）", percent(s.base_rate), percent(s.holdout_base_rate)],
          ["差", ((s.hit - s.base_rate) * 100).toFixed(1) + " 点", ((s.holdout_hit - s.holdout_base_rate) * 100).toFixed(1) + " 点"],
        ].forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });
          stats.appendChild(tr);
        });

        document.querySelector("#latest").textContent =
          data.latest.date + "　分数 " + data.latest.score.toFixed(3) +
          "，阈值 " + data.latest.threshold.toFixed(3) +
          " → " + (data.latest.flag ? "打点（偏多）" : "不打点");

        document.querySelector("#note").textContent =
          "留出期（阈值只用 2015 年之前的数据定）打点 " + s.holdout_flagged + " 次，命中 " +
          percent(s.holdout_hit) + "，同期基率 " + percent(s.holdout_base_rate) + "。" +
          "样本只有约 " + Math.round(s.holdout_flagged / 5) + " 个独立的 5 天窗口，勉强过线，不是稳赚。";
      })
      .catch(() => { document.querySelector("#question").textContent = "cross.json 没有加载"; });
  </script>
</body>
</html>
