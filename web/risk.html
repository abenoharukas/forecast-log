<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Fear index · 涨跌点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
  <script src="/web/vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --paper: #e6e0d4;
      --sheet: #f7f3ea;
      --ink: #1c1915;
      --muted: #5e584e;
      --rule: #c9c0b0;
      --blue: #1d4e79;
      --red: #9b2c1f;
      --green: #2f6b3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Newsreader", Palatino, serif;
      overflow: hidden;
    }
    main { height: 100%; display: flex; flex-direction: column; padding: 16px 20px 12px; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { margin: 0; font-weight: 480; font-size: 28px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }
    .board { flex: 1; min-height: 0; margin-top: 10px; display: flex; gap: 12px; }
    .panes { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .pane { flex: 1; min-height: 0; background: var(--sheet); border: 1px solid var(--rule); display: flex; flex-direction: column; }
    .pane-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;
      padding: 7px 12px; border-bottom: 1px solid var(--rule);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    }
    .pane-head .name { font-size: 15px; font-weight: 500; }
    .pane-head .up { color: var(--red); }
    .pane-head .down { color: var(--blue); }
    .chart { flex: 1; min-height: 0; }
    aside {
      width: 340px; flex: none; background: var(--sheet); border: 1px solid var(--rule);
      padding: 10px 12px; font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11.5px; line-height: 1.6; overflow: auto;
    }
    aside h2 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    th { font-weight: 500; font-size: 10.5px; color: var(--muted); text-align: right; padding: 0 5px 3px; }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 0 5px; text-align: right; white-space: nowrap; }
    .block + .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
    .note { color: var(--muted); font-size: 11px; line-height: 1.55; }
    @media (max-width: 900px) {
      body { overflow: auto; }
      main { height: auto; }
      .board { flex-direction: column; }
      .pane { min-height: 320px; }
      aside { width: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Fear index · 涨跌点</h1>
      <span class="sub">纵轴 = fear index 点位；点 = 5 天前说「要涨 / 要跌」的那一天</span>
      <span class="sub" id="build"></span>
    </header>
    <div class="board">
      <div class="panes">
        <div class="pane">
          <div class="pane-head">
            <span class="name up">说「要涨」的点</span>
            <span class="sub" id="up-rule">—</span>
            <span class="sub" id="up-hit">—</span>
          </div>
          <div class="chart" id="up-chart"></div>
        </div>
        <div class="pane">
          <div class="pane-head">
            <span class="name down">说「要跌」的点</span>
            <span class="sub" id="down-rule">—</span>
            <span class="sub" id="down-hit">—</span>
          </div>
          <div class="chart" id="down-chart"></div>
        </div>
      </div>
      <aside>
        <div class="block">
          <h2>这两块画的是什么</h2>
          <div class="note">
            每个交易日收盘后算一次：未来 5 天里会不会出现单日涨超 15%（上块）或跌超 15%（下块）。
            概率落在这个方向历史最高的 10% 才打点，点画在 5 天后的那一天。
            阈值事先可以算出来，不是事后挑的。
          </div>
        </div>
        <div class="block">
          <h2>点准不准</h2>
          <table id="hits"></table>
        </div>
        <div class="block note" id="note"></div>
      </aside>
    </div>
  </main>
  <script>
    const BUILD = "r4 · 纵轴改成点位";
    document.querySelector("#build").textContent = BUILD;

    function makeChart(id) {
      return LightweightCharts.createChart(document.querySelector(id), {
        autoSize: true,
        layout: {
          background: { type: "solid", color: "#f7f3ea" },
          textColor: "#5e584e",
          fontFamily: '"IBM Plex Mono", ui-monospace, monospace',
        },
        grid: { vertLines: { color: "#eadfce" }, horzLines: { color: "#eadfce" } },
        rightPriceScale: { borderColor: "#c9c0b0", scaleMargins: { top: 0.12, bottom: 0.12 } },
        timeScale: { borderColor: "#c9c0b0", rightOffset: 4, minBarSpacing: 0.04 },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true } },
      });
    }

    const upChart = makeChart("#up-chart");
    const downChart = makeChart("#down-chart");
    const upLine = upChart.addLineSeries({ color: "#1d4e79", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const downLine = downChart.addLineSeries({ color: "#1d4e79", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });

    function percent(value) {
      return value == null ? "—" : Math.round(value * 100) + "%";
    }

    function draw(block, chart, line, color, shape) {
      const points = block.time.map((time, index) => ({ time, value: block.anchor[index] }));
      line.setData(points);
      const markers = [];
      block.flag.forEach((flag, index) => {
        if (!flag) return;
        const target = block.target[index];
        if (!block.time.includes(target)) return;
        markers.push({ time: target, position: shape === "↑" ? "belowBar" : "aboveBar", color, shape: shape === "↑" ? "arrowUp" : "arrowDown", size: 0.8 });
      });
      line.setMarkers(markers);
      chart.timeScale().fitContent();
    }

    fetch("/artifacts/risk.json?t=" + Date.now())
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then((data) => {
        draw(data.up, upChart, upLine, "#9b2c1f", "↑");
        draw(data.down, downChart, downLine, "#1d4e79", "↓");

        const text = (block) =>
          "阈值 " + percent(block.summary.threshold) + "，打了 " + block.summary.flagged + " 个点";
        document.querySelector("#up-rule").textContent = text(data.up);
        document.querySelector("#down-rule").textContent = text(data.down);
        document.querySelector("#up-hit").textContent =
          "这些点后来真涨的 " + percent(data.up.summary.hit) + "（基率 " + percent(data.up.summary.base_rate) + "）";
        document.querySelector("#down-hit").textContent =
          "这些点后来真跌的 " + percent(data.down.summary.hit) + "（基率 " + percent(data.down.summary.base_rate) + "）";

        const hits = document.querySelector("#hits");
        hits.textContent = "";
        [
          ["", "要涨的点", "要跌的点"],
          ["点数", String(data.up.summary.flagged), String(data.down.summary.flagged)],
          ["真发生", percent(data.up.summary.hit), percent(data.down.summary.hit)],
          ["基率", percent(data.up.summary.base_rate), percent(data.down.summary.base_rate)],
          ["Brier", data.up.summary.brier_model.toFixed(4), data.down.summary.brier_model.toFixed(4)],
          ["只看基率", data.up.summary.brier_base.toFixed(4), data.down.summary.brier_base.toFixed(4)],
        ].forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });
          hits.appendChild(tr);
        });

        document.querySelector("#note").textContent =
          "下块可用：打了 " + data.down.summary.flagged + " 个点，后来真跌的 " +
          percent(data.down.summary.hit) + "，基率只有 " + percent(data.down.summary.base_rate) + "。" +
          "上块不可用：这些点真涨的只有 " + percent(data.up.summary.hit) + "，比基率 " +
          percent(data.up.summary.base_rate) + " 还低，所以红箭头基本是反的，别照着做。";
      })
      .catch(() => {
        document.querySelector("#up-rule").textContent = "risk.json 没有加载";
      });
  </script>
</body>
</html>
